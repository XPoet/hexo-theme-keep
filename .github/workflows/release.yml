on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish'
        required: true
        type: string

name: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: google-github-actions/release-please-action@v3
        id: release
        if: ${{ github.event_name == 'push' }}
        with:
          token: ${{ secrets.ACTIONS_TOKEN }}
          release-type: node
          package-name: hexo-theme-keep
          changelog-types: >-
            [
            {
              "type": "feat",
              "section": "🌟 Features",
              "hidden": false
            },
            {
              "type": "fix",
              "section": "🐞 Bug Fixes",
              "hidden": false
            },
            {
              "type": "docs",
              "section": "📖 Docs",
              "hidden": false
            },
            {
              "type": "style",
              "section": "🎨 Styling",
              "hidden": false
            },
            {
              "type": "refactor",
              "section": "🍭 Code Refactoring",
              "hidden": false
            },
            {
              "type": "perf",
              "section": "🛠 Performance Improvements",
              "hidden": false
            },
            {
              "type": "test",
              "section": "🚧 Tests",
              "hidden": false
            },
            {
              "type": "build",
              "section": "📦 Build System",
              "hidden": false
            },
            {
              "type": "revert",
              "section": "🌀 Reverts",
              "hidden": false
            },
            {
              "type": "ci",
              "section": "🎯 CI",
              "hidden": false
            },
            {
              "type": "ui",
              "section": "💄 Improvement UI",
              "hidden": false
            },
            {
              "type": "chore",
              "section": "🚦 Chore",
              "hidden": false
            }
            ]

      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true' }}
        with:
          ref: refs/tags/${{ inputs.tag || steps.release.outputs.tag_name }}

      - uses: actions/setup-node@v6
        if: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true' }}
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify release tag
        if: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true' }}
        env:
          RELEASE_TAG: ${{ inputs.tag || steps.release.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const { version } = require('./package.json')
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must match the version in package.json')
          }
          NODE
          gh release view "$RELEASE_TAG" --json isDraft --jq 'if .isDraft then error("Cannot publish a draft release") else .isDraft end'

      # This theme intentionally does not commit a package-lock.json.
      - run: npm install --no-package-lock
        if: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true' }}

      - run: npm publish --provenance
        if: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true' }}
